<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포켓몬GO×SKT 잉어킹 카드 이벤트</title>
<meta name="description" content="포켓몬GO, 포켓몬과찰칵 이벤트 참여 가이드 · 이벤트 신청 · 단골 등록">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --surface:#F7F6FB; --line:#E7E3F5;
    --text:#1B1626; --muted:#6C6478;
    --accent:#4B2FD1; --accent-dark:#241454; --accent-soft:#EFEAFB;
    --warm:#FFF6DC; --warm-text:#8A5A00; --warm-line:#F3E2A8;
    --radius:16px; --pad:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  #root{max-width:520px;margin:0 auto;min-height:100vh}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    gap:8px;height:52px;padding:0 var(--pad);background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line)}
  .topbar .badge{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    padding:3px 8px;border-radius:999px}
  .topbar .name{font-size:14px;font-weight:700;color:var(--accent-dark)}

  .hero{padding:28px var(--pad) 8px;text-align:center}
  .hero .cardimg{width:170px;margin:0 auto 16px;border-radius:14px;
    box-shadow:0 10px 30px rgba(36,20,84,.18)}
  .hero h1{margin:0 0 6px;font-size:21px;line-height:1.4;letter-spacing:-0.02em;
    color:var(--accent-dark)}
  .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  .chiprow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-top:16px}
  .chip{font-size:12px;font-weight:600;color:var(--accent-dark);
    background:var(--accent-soft);border-radius:999px;padding:6px 11px}
  .chip.mono{color:var(--muted);background:var(--surface);border:1px solid var(--line)}

  .quickrow{display:flex;gap:10px;padding:20px var(--pad) 4px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:48px;padding:12px 14px;border:0;border-radius:var(--radius);
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent)}
  .btn.block{width:100%}
  .btn svg{flex:none}

  .section{padding:28px var(--pad) 0}
  .section h2{margin:0 0 4px;font-size:17px;font-weight:800;color:var(--text)}
  .section .sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}

  .tlrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tlrow::-webkit-scrollbar{display:none}
  .tlcard{flex:none;min-width:104px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:12px 10px;text-align:center}
  .tlcard.hi{background:var(--accent-soft);border-color:var(--accent)}
  .tlcard .d{font-size:13px;font-weight:800;color:var(--accent-dark)}
  .tlcard .l{margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.4}

  .steps{position:relative;padding-left:2px}
  .step{position:relative;display:flex;gap:14px;padding-bottom:26px}
  .step:last-child{padding-bottom:0}
  .step .line{position:absolute;left:15px;top:34px;bottom:-2px;width:2px;
    background:var(--line)}
  .step:last-child .line{display:none}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;
    justify-content:center;z-index:1}
  .stepbody{flex:1;min-width:0;padding-top:2px}
  .stepbody h3{margin:0 0 5px;font-size:15px;font-weight:700}
  .stepbody p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
  .stepimg{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .hashbox{margin-top:10px;display:flex;align-items:center;gap:8px;
    background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;
    padding:10px 12px}
  .hashbox .tag{flex:1;font-size:13.5px;font-weight:700;color:var(--warm-text)}
  .copybtn{flex:none;font-size:12px;font-weight:700;color:var(--warm-text);
    background:#fff;border:1px solid var(--warm-line);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-family:inherit}
  .stepnote{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.6;
    background:var(--surface);border-radius:10px;padding:9px 11px}
  .stepwarn{margin-top:9px;font-size:12.5px;color:var(--warm-text);line-height:1.6;
    background:var(--warm);border:1px solid var(--warm-line);border-radius:10px;
    padding:9px 11px}
  .steplist{margin:8px 0 0;padding-left:0;list-style:none;font-size:13px;
    color:var(--muted)}
  .steplist li{padding:5px 0 5px 16px;position:relative;line-height:1.5}
  .steplist li:before{content:'';position:absolute;left:0;top:12px;width:4px;
    height:4px;border-radius:50%;background:var(--muted)}
  .stepcta{margin-top:12px}

  .bonuscard{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden}
  .bonuscard img{width:100%}
  .bonuscard .body{padding:14px 16px 16px}
  .bonuscard h3{margin:0 0 6px;font-size:15px;font-weight:700}
  .bonuscard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
  .bonuscard ul{margin:10px 0 0;padding-left:16px;color:var(--muted);
    font-size:12.5px;line-height:1.8}

  .faqitem{border-bottom:1px solid var(--line)}
  .faqitem:last-child{border-bottom:0}
  .faqq{width:100%;text-align:left;background:none;border:0;padding:14px 2px;
    display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit}
  .faqq .qbadge{flex:none;font-size:11px;font-weight:800;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 7px}
  .faqq .qtext{flex:1;font-size:14px;font-weight:700;color:var(--text)}
  .faqq svg{flex:none;transition:transform .15s}
  .faqq.open svg{transform:rotate(180deg)}
  .faqa{padding:0 2px 16px 41px;font-size:13.5px;color:var(--muted);line-height:1.7}
  .faqnote{margin-top:12px;padding:12px 14px;background:var(--accent-dark);
    color:#fff;border-radius:12px;font-size:12.5px;line-height:1.7;font-weight:600}

  .footer{padding:30px var(--pad) 10px;color:var(--muted);font-size:11.5px;
    line-height:1.8;text-align:center}
  .footer .rule{width:32px;height:1px;background:var(--line);margin:0 auto 14px}

  button,a.btn,[role="button"]{min-height:44px}
</style>
</head>
<body>
<div id="root"></div>

  return e('div', { className: 'hashbox' },
    e('span', { className: 'tag' }, CONFIG.hashtag),
    e('button', { className: 'copybtn', onClick: doCopy }, copied ? '복사됨' : '복사')
  );
}

function StepCTA(props) {
  var url = CONFIG[props.urlKey];
  return e('div', { className: 'stepcta' },
    e('a', { className: 'btn block', href: url, target: '_blank', rel: 'noopener noreferrer' },
      props.label, e(ExternalIcon))
  );
}

function Step(props) {
  var s = props.data;
  return e('div', { className: 'step' },
    e('div', { className: 'line' }),
    e('div', { className: 'num' }, s.num),
    e('div', { className: 'stepbody' },
      e('h3', null, s.title),
      e('p', null, s.desc),
      s.image === 'steps' ? e('div', { className: 'stepimg' }, e('img', { src: IMG_STEPS, alt: 'Pokémon GO 촬영 화면 예시' })) : null,
      s.hashtag ? e(HashBox, null) : null,
      s.list ? e('ul', { className: 'steplist' }, s.list.map(function (li, i) { return e('li', { key: i }, li); })) : null,
      s.warn ? e('div', { className: 'stepwarn' }, s.warn) : null,
      s.note ? e('div', { className: 'stepnote' }, s.note) : null,
      s.cta ? e(StepCTA, s.cta) : null
    )
  );
}

function Steps() {
  return e('div', { className: 'section' },
    e('h2', null, '참여 방법 한눈에 보기'),
    e('p', { className: 'sub' }, '아래 순서대로 진행하면 잉어킹 프로모 카드를 받을 수 있어요.'),
    e('div', { className: 'steps' },
      CONFIG.steps.map(function (s, i) { return e(Step, { data: s, key: i }); })
    )
  );
}

function Bonus() {
  var b = CONFIG.bonus;
  return e('div', { className: 'section' },
    e('h2', null, '추가 이벤트'),
    e('p', { className: 'sub' }, '카드 수령과 별개로 참여할 수 있는 SNS 이벤트예요.'),
    e('div', { className: 'bonuscard' },
      e('img', { src: IMG_BONUS, alt: '매장 앞 인증 이벤트' }),
      e('div', { className: 'body' },
        e('h3', null, b.title),
        e('p', null, b.desc),
        e('ul', null, b.bullets.map(function (x, i) { return e('li', { key: i }, x); }))
      )
    )
  );
}

function FaqItem(props) {
  var s = useState(false);
  var open = s[0], setOpen = s[1];
  return e('div', { className: 'faqitem' },
    e('button', { className: 'faqq' + (open ? ' open' : ''), onClick: function () { setOpen(!open); } },
      e('span', { className: 'qbadge' }, 'Q' + (props.idx + 1)),
      e('span', { className: 'qtext' }, props.data.q),
      e(Chevron, null)
    ),
    open ? e('div', { className: 'faqa' }, props.data.a) : null
  );
}

function Faq() {
  return e('div', { className: 'section' },
    e('h2', null, '자주 묻는 질문'),
    e('p', { className: 'sub' }, '짧고 동일하게 안내해 고객 혼선을 줄여요.'),
    CONFIG.faq.map(function (f, i) { return e(FaqItem, { data: f, idx: i, key: i }); }),
    e('div', { className: 'faqnote' }, CONFIG.faqNote)
  );
}

function Footer() {
  return e('div', { className: 'footer' },
    e('div', { className: 'rule' }),
    e('div', null, CONFIG.appName + ' · 안내 자료 기준일 ' + CONFIG.updatedAt),
    e('div', null, '세부 프로세스는 매장 상황에 따라 다를 수 있어요. 정확한 내용은 매장 직원에게 문의해 주세요.')
  );
}

function App() {
  return e(React.Fragment, null,
    e(TopBar, null),
    e(Hero, null),
    e(QuickActions, null),
    e(Timeline, null),
    e(Steps, null),
    e(Bonus, null),
    e(Faq, null),
    e(Footer, null)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App, null));
</script>
</body>
</html>
