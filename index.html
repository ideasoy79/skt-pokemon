<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포켓몬GO×SKT 잉어킹 카드 이벤트</title>
<meta name="description" content="포켓몬GO, 포켓몬과찰칵 이벤트 참여 가이드 · 이벤트 신청 · 단골 등록">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --surface:#F7F6FB; --line:#E7E3F5;
    --text:#1B1626; --muted:#6C6478;
    --accent:#4B2FD1; --accent-dark:#241454; --accent-soft:#EFEAFB;
    --warm:#FFF6DC; --warm-text:#8A5A00; --warm-line:#F3E2A8;
    --radius:16px; --pad:clamp(16px, 5vw, 22px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  #root{max-width:520px;margin:0 auto;min-height:100vh}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    gap:8px;height:52px;padding:0 var(--pad);background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line)}
  .topbar .badge{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    padding:3px 8px;border-radius:999px;flex:none}
  .topbar .name{font-size:clamp(12.5px,3.6vw,14px);font-weight:700;color:var(--accent-dark);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hero{padding:0 0 8px;text-align:center}
  .hero .heroimg{width:100%;display:block}
  .herotext{padding:18px var(--pad) 0}
  .hero h1{margin:0 0 6px;font-size:clamp(18px,5.5vw,21px);line-height:1.4;
    letter-spacing:-0.02em;color:var(--accent-dark)}
  .hero p{margin:0;color:var(--muted);font-size:clamp(13px,3.6vw,14px);line-height:1.6}
  .heroemph{margin-top:12px;background:var(--accent-dark);color:#fff;font-weight:800;
    font-size:clamp(13.5px,3.8vw,15.5px);line-height:1.6;border-radius:14px;padding:12px 14px}

  .chiprow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-top:16px}
  .chip{font-size:12px;font-weight:600;color:var(--accent-dark);
    background:var(--accent-soft);border-radius:999px;padding:6px 11px}
  .chip.mono{color:var(--muted);background:var(--surface);border:1px solid var(--line)}

  .quickrow{display:flex;gap:10px;padding:20px var(--pad) 4px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:48px;padding:12px 14px;border:0;border-radius:var(--radius);
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent)}
  .btn.block{width:100%}
  .btn svg{flex:none}

  .section{padding:28px var(--pad) 0}
  .section h2{margin:0 0 4px;font-size:clamp(15.5px,4.3vw,17px);font-weight:800;color:var(--text)}
  .section .sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}

  .tlhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
    gap:6px;background:var(--accent-dark);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .tlheadlabel{font-size:12px;font-weight:600;color:#D9D2F5}
  .tlheadvalue{font-size:14px;font-weight:800;color:#fff}
  .tllist{display:flex;flex-direction:column}
  .tlitem{position:relative;display:flex;gap:12px;padding-bottom:18px}
  .tlitem:last-child{padding-bottom:0}
  .tldot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line);
    margin-top:5px;position:relative;z-index:1}
  .tlitem.hi .tldot{background:var(--accent)}
  .tlline{position:absolute;left:4px;top:15px;bottom:-3px;width:2px;background:var(--line)}
  .tlitem:last-child .tlline{display:none}
  .tlbody{flex:1;min-width:0}
  .tld{font-size:13px;font-weight:800;color:var(--accent-dark)}
  .tlitem.hi .tld{color:var(--accent)}
  .tll{margin-top:2px;font-size:12.5px;color:var(--muted);line-height:1.5}

  .steps{position:relative;padding-left:2px}
  .step{position:relative;display:flex;gap:14px;padding-bottom:26px}
  .step:last-child{padding-bottom:0}
  .step .line{position:absolute;left:15px;top:34px;bottom:-2px;width:2px;
    background:var(--line)}
  .step:last-child .line{display:none}
  .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;
    justify-content:center;z-index:1}
  .stepbody{flex:1;min-width:0;padding-top:2px}
  .stepbody h3{margin:0 0 5px;font-size:15px;font-weight:700}
  .stepbody p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}

  .gallery{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gitem img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .gcap{padding:6px 8px 8px;font-size:11px;color:var(--muted);line-height:1.4}

  .examplebox{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .examplebox img{width:100%;display:block}
  .examplecap{padding:9px 12px;background:var(--accent-soft);font-size:12px;
    font-weight:700;color:var(--accent-dark)}

  .hashbox{margin-top:10px;display:flex;align-items:center;gap:8px;
    background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;
    padding:10px 12px}
  .hashbox .tag{flex:1;font-size:13.5px;font-weight:700;color:var(--warm-text)}
  .copybtn{flex:none;font-size:12px;font-weight:700;color:var(--warm-text);
    background:#fff;border:1px solid var(--warm-line);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-family:inherit}
  .stepnote{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.6;
    background:var(--surface);border-radius:10px;padding:9px 11px}
  .stepwarn{margin-top:9px;font-size:12.5px;color:var(--warm-text);line-height:1.6;
    background:var(--warm);border:1px solid var(--warm-line);border-radius:10px;
    padding:9px 11px}
  .steplist{margin:8px 0 0;padding-left:0;list-style:none;font-size:13px;
    color:var(--muted)}
  .steplist li{padding:5px 0 5px 16px;position:relative;line-height:1.5}
  .steplist li:before{content:'';position:absolute;left:0;top:12px;width:4px;
    height:4px;border-radius:50%;background:var(--muted)}
  .stepcta{margin-top:12px}
  .steptip{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.6;
    background:var(--surface);border-radius:10px;padding:9px 11px}
  .steptip b{color:var(--accent-dark);font-weight:800}

  .accordion{margin-top:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden}
  .acchead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    background:none;border:0;padding:14px;cursor:pointer;font-family:inherit}
  .accheadtext{flex:1;min-width:0}
  .acctitle{font-size:14px;font-weight:700;color:var(--text)}
  .accsub{margin-top:3px;font-size:12px;color:var(--muted);line-height:1.5}
  .acchead svg{flex:none;transition:transform .15s}
  .acchead.open svg{transform:rotate(180deg)}
  .accbody{padding:0 14px 16px}
  .accnote{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .storelist{display:flex;flex-direction:column;gap:8px}
  .storeitem{display:flex;align-items:center;gap:8px;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    width:100%;text-align:left;font-family:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none;color:inherit}
  .storeitem.hi{border-color:var(--accent);background:var(--accent-soft)}
  .storemain{flex:1;min-width:0;display:flex;flex-direction:column}
  .storeregion{font-size:11px;font-weight:700;color:var(--muted)}
  .storename{font-size:13.5px;font-weight:700;color:var(--text);margin-top:1px}
  .storebadge{flex:none;font-size:10.5px;font-weight:700;color:var(--accent-dark);
    background:var(--warm);border:1px solid var(--warm-line);border-radius:999px;
    padding:3px 7px;white-space:nowrap}
  .daesanote{margin-top:12px;display:flex;gap:10px;align-items:center;
    background:var(--warm);border:1px solid var(--warm-line);border-radius:12px;padding:10px}
  .daesanote img{width:60px;height:60px;object-fit:cover;border-radius:8px;flex:none}
  .daesanote p{margin:0;font-size:12px;color:var(--warm-text);line-height:1.6}

  .bonuscard{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden}
  .bonuscard img{width:100%}
  .bonuscard .body{padding:14px 16px 16px}
  .bonuscard h3{margin:0 0 6px;font-size:15px;font-weight:700}
  .bonuscard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
  .bonuscard ul{margin:10px 0 0;padding-left:16px;color:var(--muted);
    font-size:12.5px;line-height:1.8}

  .faqitem{border-bottom:1px solid var(--line)}
  .faqitem:last-child{border-bottom:0}
  .faqq{width:100%;text-align:left;background:none;border:0;padding:14px 2px;
    display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit}
  .faqq .qbadge{flex:none;font-size:11px;font-weight:800;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 7px}
  .faqq .qtext{flex:1;font-size:14px;font-weight:700;color:var(--text)}
  .faqq svg{flex:none;transition:transform .15s}
  .faqq.open svg{transform:rotate(180deg)}
  .faqa{padding:0 2px 16px 41px;font-size:13.5px;color:var(--muted);line-height:1.7}
  .faqnote{margin-top:12px;padding:12px 14px;background:var(--accent-dark);
    color:#fff;border-radius:12px;font-size:12.5px;line-height:1.7;font-weight:600}

  .footer{padding:30px var(--pad) 10px;color:var(--muted);font-size:11.5px;
    line-height:1.8;text-align:center}
  .footer .rule{width:32px;height:1px;background:var(--line);margin:0 auto 14px}

  button,a.btn,[role="button"]{min-height:44px}
</style>
</head>

<div id="root"></div>

      );
    })
  );

function HashBox() {
  var s = useState(false);
  var copied = s[0], setCopied = s[1];
  function doCopy() {
    var text = CONFIG.hashtag;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setCopied(true);
        setTimeout(function () { setCopied(false); }, 1600);
      });
    }
  }
  return e('div', { className: 'hashbox' },
    e('span', { className: 'tag' }, CONFIG.hashtag),
    e('button', { type: 'button', className: 'copybtn', onClick: doCopy }, copied ? '복사됨' : '복사')
  );
}
